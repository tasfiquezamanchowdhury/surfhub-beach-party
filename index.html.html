:root{

.bokeh i:nth-child(3){width:120px;height:120px;left:88%;top:52%;animation-delay:-9s}
.bokeh i:nth-child(4){width:50px;height:50px;left:40%;top:90%;animation-delay:-3s}

api.go=function(id,instant){var z=BY[id];if(!z)return;setCard(z);mark(false,false);flyTo(z.cam[0],z.cam[1],instant);tourI=ZONES.indexOf(z);};
function overview(){stopTour();setCard(null);mark(true,false);flyTo([14,58,82],[0,0,-1]);}
bOver.addEventListener('click',overview);
bPlan.addEventListener('click',function(){stopTour();setCard(null);mark(false,true);flyTo([0,108,10],[0,0,0]);});
bTour.addEventListener('click',function(){if(tour){stopTour();return;}tour=true;bTour.setAttribute('aria-pressed','true');bTour.textContent='Stop tour';tourI=(tourI+1)%ZONES.length;api.go(ZONES[tourI].id);});
controls.addEventListener('start',function(){tween=null;stopTour();});
labelsEl.addEventListener('click',function(){stopTour();},true);idxEl.addEventListener('click',function(){stopTour();},true);

/* ===== sound ===== */
var actx=null,master=null,soundOn=false,crackle=0,sBtn=document.getElementById('sound'),sTxt=document.getElementById('sound-t'),noiseBuf=null;
function startAudio(){try{var AC=window.AudioContext||window.webkitAudioContext;actx=new AC();master=actx.createGain();master.gain.value=0;master.connect(actx.destination);
  var len=actx.sampleRate*3,b=actx.createBuffer(1,len,actx.sampleRate),d=b.getChannelData(0),last=0;for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5;}noiseBuf=b;
  var src=actx.createBufferSource();src.buffer=b;src.loop=true;var lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;var wg=actx.createGain();wg.gain.value=0.5;
  var lfo=actx.createOscillator();lfo.frequency.value=0.12;var lg=actx.createGain();lg.gain.value=0.35;lfo.connect(lg);lg.connect(wg.gain);src.connect(lp);lp.connect(wg);wg.connect(master);src.start();lfo.start();
  [110,164.8,220.5].forEach(function(f,i){var o=actx.createOscillator();o.type='sine';o.frequency.value=f;var g=actx.createGain();g.gain.value=0.012/(i+1);o.connect(g);g.connect(master);o.start();});
  crackle=setInterval(function(){if(!soundOn||!actx)return;if(Math.random()<0.6){var s=actx.createBufferSource();s.buffer=noiseBuf;var bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800+Math.random()*3000;var g=actx.createGain();g.gain.value=0.15+Math.random()*0.25;g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.05);s.connect(bp);bp.connect(g);g.connect(master);s.start(0,Math.random()*2,0.06);}},160);
  }catch(e){actx=null;}}
sBtn.addEventListener('click',function(){soundOn=!soundOn;if(soundOn&&!actx)startAudio();if(!actx){soundOn=false;return;}
  if(soundOn&&actx.state==='suspended')actx.resume();master.gain.cancelScheduledValues(actx.currentTime);master.gain.linearRampToValueAtTime(soundOn?0.5:0,actx.currentTime+0.6);
  sBtn.setAttribute('aria-pressed',soundOn?'true':'false');sTxt.textContent=soundOn?'Sound on':'Sound off';});

/* ===== resize, labels, loop ===== */
function resize(){var w=viewer.clientWidth||1,h=viewer.clientHeight||1;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();viewer.classList.toggle('narrow',w<720);}
if(window.ResizeObserver)new ResizeObserver(resize).observe(viewer);else window.addEventListener('resize',resize);
resize();api.go('gate',true);setCard(null);mark(true,false);flyTo([14,58,82],[0,0,-1],true);
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('italic 600 40px "Cormorant Garamond"'),document.fonts.load('500 20px Jost')]).then(function(){signs.forEach(function(s){s.ctx.clearRect(0,0,s.c.width,s.c.height);s.draw(s.ctx,s.c.width,s.c.height);s.tex.needsUpdate=true;});}).catch(function(){});}
var pinList=Array.prototype.map.call(labelsEl.children,function(el){return {el:el,a:V3.apply(null,BY[el.dataset.id].a)};}),tv=V3(0,0,0);
function updatePins(){var w=viewer.clientWidth,h=viewer.clientHeight;pinList.forEach(function(p){tv.copy(p.a).project(camera);var vis=tv.z<1&&tv.x>-1.05&&tv.x<1.05&&tv.y>-1.05&&tv.y<1.05;p.el.hidden=!vis;if(vis)p.el.style.transform='translate3d('+((tv.x*0.5+0.5)*w)+'px,'+((-tv.y*0.5+0.5)*h)+'px,0) translate(-50%,-50%)';});}
var clock=new THREE.Clock(),T=0,ledAcc=0,first=true,ease=function(k){return k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;},LAM=2*Math.PI/K;
var loadingEl=document.getElementById('loading');
function frame(){requestAnimationFrame(frame);var dt=Math.min(clock.getDelta(),0.1);T+=dt*(reduce?0.3:1);var t=T,now=performance.now(),i;
  if(tween){var k=clamp((now-tween.t0)/tween.dur,0,1),e=ease(k);camera.position.lerpVectors(tween.p0,tween.p1,e);camera.position.y+=Math.sin(Math.PI*e)*6;controls.target.lerpVectors(tween.q0,tween.q1,e);if(k>=1){tween=null;lastMove=now;}}
  else if(tour&&now-lastMove>5600){tourI=(tourI+1)%ZONES.length;api.go(ZONES[tourI].id);}
  controls.target.clamp(tmin,tmax);controls.update();
  for(i=0;i<seaP.count;i++)seaP.setY(i,-0.04+waveH(seaX[i],seaZ[i],t));seaP.needsUpdate=true;seaGeo.computeVertexNormals();
  foam.position.z=17.2+Math.sin(t*0.9)*0.5;foam.material.opacity=0.22+0.12*Math.sin(t*0.9+1);
  surfers.forEach(function(s){var x=s.x0+3*Math.sin(0.35*t+s.i*2),z=sz0+((((Math.PI/2+W*t-0.05*x)/K-sz0)%LAM)+LAM)%LAM;
    var h=waveH(x,z,t),hf=waveH(x,z+0.8,t),hb=waveH(x,z-0.8,t);s.g.position.set(x,h,z);s.g.rotation.x=-Math.atan2(hf-hb,1.6);s.g.rotation.z=Math.sin(t*1.3+s.i)*0.18;
    var edge=Math.min(clamp((z-sz0)/2,0,1),clamp((sz1-z)/2,0,1));s.g.scale.setScalar(0.001+edge*0.999);s.tor.rotation.x=0.4+Math.sin(t*2+s.i)*0.08;s.arms.rotation.z=Math.sin(t*1.6+s.i)*0.25;});
  for(i=0;i<buoyPos.length;i++){var bp=buoyPos[i];DD.position.set(bp[0],waveH(bp[0],bp[1],t)+0.1,bp[1]);DD.rotation.set(0,0,0);DD.scale.set(1,1,1);DD.updateMatrix();buoyMesh.setMatrixAt(i,DD.matrix);}buoyMesh.instanceMatrix.needsUpdate=true;
  surfBan.position.set(1,waveH(1,32.5,t)+0.05,32.5);
  var sw=reduce?0.3:1;beams.forEach(function(b){b.pv.rotation.x=-(0.5+0.25*Math.sin(t*0.6*sw+b.i*1.3));b.pv.rotation.z=Math.sin(t*0.8*sw+b.i*0.9)*0.45;});
  band.forEach(function(b,j){b.rotation.y=Math.sin(t*1.5+j)*0.12;b.position.y=0.9+Math.abs(Math.sin(t*2.4+j))*0.05*sw;});
  ledAcc+=dt;if(ledAcc>0.1){ledAcc=0;drawLED(t);}
  cards.forEach(function(c,j){var a=t*1.4+j*2.1;c.position.set(Math.cos(a)*0.5,1.6+Math.sin(t*2+j)*0.12,Math.sin(a)*0.5);c.rotation.y=a;c.rotation.z=Math.sin(a)*0.4;});
  updatePeople(t);
  palms.forEach(function(p){p.c.rotation.z=Math.sin(t*0.8+p.ph)*0.05;p.c.rotation.x=Math.cos(t*0.6+p.ph)*0.04;});
  flames.forEach(function(f){var s=1+Math.sin(t*9+f.ph)*0.18+Math.sin(t*14+f.ph*2)*0.1;f.f.scale.set(1,s,1);});
  flameM.forEach(function(f,j){var s=1+Math.sin(t*8+j*2)*0.12+Math.sin(t*13+j)*0.08;f.scale.set(1+Math.sin(t*6+j)*0.06,s,1);});
  fireL.intensity=2.2+Math.sin(t*11)*0.35+Math.sin(t*17)*0.2;
  owlM.opacity=0.75+0.25*Math.sin(t*1.2);
  var sp2=sparkG.attributes.position;for(i=0;i<sparkN;i++){var yy=sp2.getY(i)+sparkV[i]*dt;if(yy>6){yy=0.5;}sp2.setXYZ(i,40.5+Math.sin(t*0.8+i)*(0.3+yy*0.12),yy,5.8+Math.cos(t*0.7+i*1.3)*(0.3+yy*0.12));}sp2.needsUpdate=true;
  var fp=ffG.attributes.position;for(i=0;i<FFN;i++){var b=ffB[i];fp.setXYZ(i,b[0]+Math.sin(t*0.3+b[3])*2,b[1]+Math.sin(t*0.5+b[3]*2)*0.8,b[2]+Math.cos(t*0.25+b[3])*2);}fp.needsUpdate=true;
  renderer.render(scene,camera);updatePins();
  if(first){first=false;loadingEl.classList.add('done');setTimeout(function(){loadingEl.hidden=true;},700);}}
frame();
})();</script>
